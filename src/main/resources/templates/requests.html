<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blood Requests</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        .navbar {
            background-color: #b71c1c;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 20px;
        }

        .back-btn {
            color: white;
            text-decoration: none;

            padding: 9px 18px;

            border: 1px solid white;
            border-radius: 4px;
        }

        .back-btn:hover {
            background-color: white;
            color: #b71c1c;
        }

        .container {
            width: 90%;
            max-width: 1000px;

            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #b71c1c;

            margin-bottom: 25px;
        }

        .request-card {
            background-color: white;

            padding: 22px;

            margin-bottom: 20px;

            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #ddd;

            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .blood-group {
            font-size: 24px;
            font-weight: bold;
            color: #b71c1c;
        }

        .urgency {
            padding: 7px 12px;

            background-color: #ffebee;
            color: #b71c1c;

            border: 1px solid #ffcdd2;

            font-weight: bold;
        }

        .details {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .detail {
            padding: 8px;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            margin-left: 5px;
        }

        .status {
            margin-top: 15px;

            padding: 10px;

            background-color: #e8f5e9;
            color: #2e7d32;

            border: 1px solid #c8e6c9;

            font-weight: bold;
        }

        .no-requests {
            background-color: white;

            text-align: center;

            padding: 40px;

            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .no-requests h2 {
            margin-bottom: 10px;
        }

        .no-requests p {
            color: #666;
        }

        @media (max-width: 700px) {

            .details {
                grid-template-columns: 1fr;
            }

            .request-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .navbar {
                padding: 15px 20px;
            }

        }

    </style>

</head>


<body>


    <div class="navbar">

        <h2>
            Emergency Blood Coordination
        </h2>

        <a href="/dashboard.html"
           class="back-btn">

            Back to Dashboard

        </a>

    </div>


    <div class="container">

        <h1>
            Emergency Blood Requests
        </h1>


        <!-- No Requests -->

        <div th:if="${#lists.isEmpty(requests)}"
             class="no-requests">

            <h2>
                No Blood Requests
            </h2>

            <p>
                There are currently no active blood requests.
            </p>

        </div>


        <!-- Display Requests -->

        <div th:each="request : ${requests}"
             class="request-card">


            <div class="request-header">

                <div class="blood-group"
                     th:text="${request.bloodGroup}">

                    O+

                </div>


                <div class="urgency"
                     th:text="${request.urgency}">

                    URGENT

                </div>

            </div>


            <div class="details">


                <div class="detail">

                    <span class="label">
                        Patient Name:
                    </span>

                    <span class="value"
                          th:text="${request.patientName}">

                        Patient

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Phone:
                    </span>

                    <span class="value"
                          th:text="${request.patientPhone}">

                        9876543210

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Blood Group:
                    </span>

                    <span class="value"
                          th:text="${request.bloodGroup}">

                        O+

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Units Required:
                    </span>

                    <span class="value"
                          th:text="${request.unitsRequired}">

                        2

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Hospital:
                    </span>

                    <span class="value"
                          th:text="${request.hospitalName}">

                        Hospital

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Location:
                    </span>

                    <span class="value"
                          th:text="${request.hospitalLocation}">

                        Chennai

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Request Date:
                    </span>

                    <span class="value"
                          th:text="${request.requestDate}">

                        Date

                    </span>

                </div>


            </div>


            <div class="status"
                 th:text="'Status: ' + ${request.status}">

                Status: ACTIVE

            </div>


        </div>


    </div>


</body>

</html>
