<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Donor Registration</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        .container {
            width: 450px;
            background-color: white;

            padding: 30px;

            border: 1px solid #ddd;
            border-radius: 5px;
        }

        h1 {
            text-align: center;
            color: #b71c1c;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;

            border: 1px solid #ccc;
            border-radius: 4px;

            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #b71c1c;
        }

        button {
            width: 100%;

            padding: 11px;
            margin-top: 25px;

            border: none;
            border-radius: 4px;

            background-color: #b71c1c;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #8e0000;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #b71c1c;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link a:hover {
            color: #b71c1c;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>
            Donor Registration
        </h1>

        <p class="subtitle">
            Register as a blood donor
        </p>


        <form action="/signup" method="post">


            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <label for="bloodGroup">
                Blood Group
            </label>

            <select
                id="bloodGroup"
                name="bloodGroup"
                required
            >

                <option value="">
                    Select Blood Group
                </option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>


            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                name="age"
                min="18"
                max="65"
                placeholder="Enter your age"
                required
            >


            <label for="gender">
                Gender
            </label>

            <select
                id="gender"
                name="gender"
                required
            >

                <option value="">
                    Select Gender
                </option>

                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>

            </select>


            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >


            <label for="lastDonationDate">
                Last Donation Date
            </label>

            <input
                type="date"
                id="lastDonationDate"
                name="lastDonationDate"
            >


            <button type="submit">
                Register as Donor
            </button>

        </form>


        <div class="login-link">

            Already registered?

            <a href="/login.html">
                Login here
            </a>

        </div>


        <div class="home-link">

            <a href="/index.html">
                Back to Home
            </a>

        </div>


    </div>


</body>

</html>
