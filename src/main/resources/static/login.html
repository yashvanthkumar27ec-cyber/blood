<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Donor Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background-color: white;

            padding: 30px;

            border: 1px solid #ddd;
            border-radius: 5px;
        }

        h1 {
            text-align: center;
            color: #b71c1c;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;

            border: 1px solid #ccc;
            border-radius: 4px;

            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #b71c1c;
        }

        button {
            width: 100%;

            padding: 11px;
            margin-top: 25px;

            border: none;
            border-radius: 4px;

            background-color: #b71c1c;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #8e0000;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #b71c1c;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error {
            background-color: #ffebee;
            color: #b71c1c;

            border: 1px solid #ffcdd2;

            padding: 10px;
            margin-bottom: 15px;

            text-align: center;

            display: none;
        }

        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link a:hover {
            color: #b71c1c;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>
            Donor Login
        </h1>

        <p class="subtitle">
            Emergency Blood Donor Coordination System
        </p>


        <!-- Error Message -->

        <div class="error" id="errorMessage">
            Invalid email or password.
        </div>


        <!-- Login Form -->

        <form action="/signin" method="post">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Sign In
            </button>

        </form>


        <!-- Registration -->

        <div class="register-link">

            Don't have an account?

            <a href="/register.html">
                Register as Donor
            </a>

        </div>


        <!-- Home -->

        <div class="home-link">

            <a href="/index.html">
                Back to Home
            </a>

        </div>

    </div>


    <!-- Error Handling -->

    <script>

        const params =
            new URLSearchParams(window.location.search);

        if (params.get("error") === "true") {

            document.getElementById("errorMessage")
                .style.display = "block";

        }

    </script>


</body>

</html>
