<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Blood Request</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #c62828;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 28px;
            border: none;
            border-radius: 6px;
            background: #c62828;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #a91f1f;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }

        .emergency-note {
            margin-top: 20px;
            padding: 12px;
            background: #fff3f3;
            border: 1px solid #ffcdd2;
            border-radius: 6px;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚨 Emergency Blood Request</h1>

    <p class="subtitle">
        Submit a request for a patient who urgently needs blood
    </p>

    <form action="/blood-request" method="post">

        <label for="patientName">Patient Name</label>

        <input
            type="text"
            id="patientName"
            name="patientName"
            placeholder="Enter patient name"
            required
        >


        <label for="patientPhone">Contact Number</label>

        <input
            type="tel"
            id="patientPhone"
            name="patientPhone"
            placeholder="Enter contact number"
            required
        >


        <label for="bloodGroup">Required Blood Group</label>

        <select id="bloodGroup" name="bloodGroup" required>

            <option value="">Select Blood Group</option>

            <option value="A+">A+</option>
            <option value="A-">A-</option>

            <option value="B+">B+</option>
            <option value="B-">B-</option>

            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>

            <option value="O+">O+</option>
            <option value="O-">O-</option>

        </select>


        <label for="unitsRequired">Units Required</label>

        <input
            type="number"
            id="unitsRequired"
            name="unitsRequired"
            min="1"
            max="10"
            placeholder="Number of units"
            required
        >


        <label for="hospitalName">Hospital Name</label>

        <input
            type="text"
            id="hospitalName"
            name="hospitalName"
            placeholder="Enter hospital name"
            required
        >


        <label for="hospitalLocation">Hospital Location</label>

        <input
            type="text"
            id="hospitalLocation"
            name="hospitalLocation"
            placeholder="Enter hospital location"
            required
        >


        <label for="urgency">Urgency Level</label>

        <select id="urgency" name="urgency" required>

            <option value="">Select Urgency</option>

            <option value="HIGH">🔴 HIGH - Immediate Need</option>

            <option value="MEDIUM">🟠 MEDIUM - Urgent</option>

            <option value="LOW">🟢 LOW - Required Soon</option>

        </select>


        <button type="submit">
            Submit Emergency Request
        </button>

    </form>


    <div class="emergency-note">

        🚨 <strong>Important:</strong>
        Please provide accurate patient and hospital information.
        This information will be used to coordinate blood donors.

    </div>


    <a href="/dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>

</html>
